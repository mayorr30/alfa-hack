[project]
build-system = { requires = ["hatchling"], build-backend = "hatchling.build" }
app = true
name = "alfa-credit-project"
version = "0.1.0"
description = "Умный кредитный кабинет предпринимателя для Альфа-Банка"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "scikit-learn>=1.5.2",
    "joblib>=1.4.2",
    "pandas>=2.2.3",
    "pytest>=8.3.3",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "psycopg2-binary>=2.9.13",
    "greenlet>=3.5.6",
    "pandas-stubs==3.0.5.260914",
    "types-pandas==2.0.0",
    "playwright>=1.64.1",
    "pytest-playwright>=0.10.0",
]

[project.scripts]
alfa-credit-project = "alfa_credit_project:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
